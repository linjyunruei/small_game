<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Hub 🕹️ 經典 HTML5 小遊戲合集平台</title>
  <meta name="description" content="包含貪吃蛇、俄羅斯方塊、飛翔小鳥、接金幣、井字棋與數獨 6 款經典小遊戲，支援網頁復古音效與手機觸控操控。">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="arcade-header">
    <div class="logo-area">
      <span class="logo-icon">🕹️</span>
      <div>
        <h1 class="logo-title">ARCADE HUB</h1>
      </div>
      <span class="logo-tag">HTML5 CLASSIC</span>
    </div>
    <div class="header-actions">
      <button id="sound-toggle-btn" class="icon-btn" title="切換音效">🔊 音效</button>
    </div>
  </header>

  <!-- Main Arcade Container -->
  <main class="arcade-container">
    
    <!-- Category Tabs Filter -->
    <nav class="filter-tabs">
      <button class="tab-btn active" data-filter="all">🎮 全部 All (15)</button>
      <button class="tab-btn" data-filter="grid">🔲 格子碰撞 Grid (3)</button>
      <button class="tab-btn" data-filter="action">⚡ 物件互動 Action (6)</button>
      <button class="tab-btn" data-filter="logic">🧠 邏輯棋牌 Logic (6)</button>
    </nav>

    <!-- Game Cards Grid -->
    <section id="games-grid" class="games-grid">
      <!-- Dynamically populated by ui.js -->
    </section>

  </main>

  <!-- Fullscreen Game Modal Viewport -->
  <div id="game-modal" class="game-modal">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="modal-title-area">
        <h2 id="modal-game-title" class="modal-game-title">遊戲名稱</h2>
      </div>
      <div class="modal-actions">
        <button id="pause-modal-btn" class="icon-btn" title="暫停">⏸️ 暫停</button>
        <button id="restart-modal-btn" class="icon-btn" title="重新開始">🔄 重來</button>
        <button id="close-modal-btn" class="icon-btn" title="離開關閉">❌ 離開</button>
      </div>
    </div>

    <!-- Modal Body Game Container -->
    <div class="modal-body">
      <div class="game-frame">
        
        <!-- Score Bar -->
        <div class="game-top-bar">
          <div class="score-display">得分: <span id="score-text">0</span></div>
          <div class="score-display">最高紀錄: <span id="highscore-text">0</span></div>
        </div>

        <!-- Dynamic Game Viewport -->
        <div id="game-viewport"></div>

        <!-- Mobile Touch Controls D-Pad Overlay -->
        <div id="touch-controls" class="touch-controls">
          <div class="dpad-container">
            <div class="dpad-cluster">
              <button class="dpad-btn up" data-action="up">▲</button>
              <button class="dpad-btn left" data-action="left">◀</button>
              <button class="dpad-btn right" data-action="right">▶</button>
              <button class="dpad-btn down" data-action="down">▼</button>
            </div>
            <div class="action-cluster">
              <button class="action-touch-btn" data-action="rotate">旋轉</button>
              <button class="action-touch-btn" data-action="harddrop">硬降</button>
            </div>
          </div>
        </div>

        <!-- Pause Overlay Modal -->
        <div id="pause-overlay" class="pause-overlay">
          <h2>GAME PAUSED</h2>
          <button id="resume-btn" class="pause-menu-btn">繼續遊戲 Resume</button>
          <button id="quit-btn" class="pause-menu-btn">返回大廳 Quit</button>
        </div>

      </div>
    </div>

  </div>

  <!-- JavaScript Modules -->
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/games/snake.js"></script>
  <script src="js/games/tetris.js"></script>
  <script src="js/games/flappy.js"></script>
  <script src="js/games/catcher.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/games/sudoku.js"></script>
  <script src="js/games/invaders.js"></script>
  <script src="js/games/pacman.js"></script>
  <script src="js/games/game2048.js"></script>
  <script src="js/games/minesweeper.js"></script>
  <script src="js/games/gomoku.js"></script>
  <script src="js/games/hangman.js"></script>
  <script src="js/games/dino.js"></script>
  <script src="js/games/match3.js"></script>
  <script src="js/games/fruitninja.js"></script>
  <script src="js/ui.js"></script>

</body>
</html>
